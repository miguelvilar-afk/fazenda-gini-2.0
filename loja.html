<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja — Três Porquinhos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="22" fill="#D98B8B"/><ellipse cx="32" cy="38" rx="10" ry="7" fill="#C97272"/><circle cx="27" cy="37" r="1.6" fill="#5C3A3A"/><circle cx="37" cy="37" r="1.6" fill="#5C3A3A"/></svg>
      <span>Três Porquinhos</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="loja.html">Loja</a>
      <a class="cart-link" href="carrinho.html">Carrinho <span id="cart-count" class="cart-count" style="display:none;">0</span></a>
      <span id="nav-user"></span>
      <a id="nav-pedidos-link" href="pedidos.html" style="display:none;">Meus pedidos</a>
      <a id="nav-perfil-link" href="perfil.html" style="display:none;">Meu perfil</a>
      <a id="nav-admin-link" class="admin-link" href="admin.html" style="display:none;">Painel administrativo</a>
      <a id="nav-login-link" class="pill" href="login.html">Entrar</a>
      <a id="nav-logout-link" href="#" onclick="logout();return false;" style="display:none;">Sair</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="section-head">
      <h1 style="margin:0;">Catálogo</h1>
      <form class="search-box" onsubmit="buscar(event)">
        <input id="busca" type="text" placeholder="Buscar por nome ou raça...">
        <button class="btn" type="submit">Buscar</button>
      </form>
    </div>

    <div id="resultado-busca" class="search-result"></div>

    <div class="filtros" id="filtros"></div>
    <br>
    <div class="grid" id="catalogo"></div>
  </div>
</section>

<footer>
  Fazenda Três Porquinhos — site criado para fins de estudo de segurança web.
</footer>

<script src="js/app.js"></script>
<script>
  let categoriaAtiva = 'Todas';

  function pigSvg(cor) {
    return '<svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="22" fill="' + cor + '"/>' +
      '<ellipse cx="32" cy="38" rx="10" ry="7" fill="#00000022"/>' +
      '<circle cx="27" cy="37" r="1.6" fill="#2E2118"/><circle cx="37" cy="37" r="1.6" fill="#2E2118"/></svg>';
  }

  function renderFiltros() {
    const categorias = ['Todas', ...new Set(PRODUTOS.map(p => p.categoria))];
    document.getElementById('filtros').innerHTML = categorias.map(c => `
      <button class="${c === categoriaAtiva ? 'ativo' : ''}" onclick="selecionarCategoria('${c}')">${c}</button>
    `).join('');
  }

  function selecionarCategoria(cat) {
    categoriaAtiva = cat;
    renderFiltros();
    renderCatalogo();
  }

  function renderCatalogo() {
    const alvo = document.getElementById('catalogo');
    const lista = PRODUTOS.filter(p => categoriaAtiva === 'Todas' || p.categoria === categoriaAtiva);
    alvo.innerHTML = lista.map(p => `
      <article class="card" style="--breed:${p.cor}">
        <span class="tag">${p.categoria}</span>
        ${pigSvg(p.cor)}
        <h3>${p.nome}</h3>
        <p>${p.descricao}</p>
        <div class="price">R$ ${p.preco.toFixed(2)}</div>
        <button class="btn" onclick="adicionarAoCarrinho(${p.id}); alert('${p.nome} adicionado ao carrinho.')">Adicionar ao carrinho</button>
      </article>
    `).join('');
  }

  // Busca "ao vivo": o texto digitado é jogado direto na página, sem
  // nenhum tratamento.
  function buscar(ev) {
    ev.preventDefault();
    const termo = document.getElementById('busca').value;
    const caixa = document.getElementById('resultado-busca');
    caixa.innerHTML = 'Resultados para: ' + termo;
    caixa.classList.add('show');
  }

  document.addEventListener('DOMContentLoaded', () => { renderFiltros(); renderCatalogo(); });
</script>
</body>
</html>
