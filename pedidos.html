<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus pedidos — Três Porquinhos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="22" fill="#D98B8B"/><ellipse cx="32" cy="38" rx="10" ry="7" fill="#C97272"/><circle cx="27" cy="37" r="1.6" fill="#5C3A3A"/><circle cx="37" cy="37" r="1.6" fill="#5C3A3A"/></svg>
      <span>Três Porquinhos</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="loja.html">Loja</a>
      <span id="nav-user"></span>
      <a id="nav-perfil-link" href="perfil.html" style="display:none;">Meu perfil</a>
      <a id="nav-admin-link" class="admin-link" href="admin.html" style="display:none;">Painel administrativo</a>
      <a id="nav-logout-link" href="#" onclick="logout();return false;">Sair</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container" id="conteudo-pedidos">
    <!-- preenchido via JS -->
  </div>
</section>

<footer>
  Fazenda Três Porquinhos — site criado para fins de estudo de segurança web.
</footer>

<script src="js/app.js"></script>
<script>
  // Esta página tem dois modos:
  // 1) pedidos.html            -> lista os pedidos do usuário logado
  // 2) pedidos.html?pedido=N   -> mostra o detalhe de UM pedido pelo número dele
  //
  // No modo 2, o número do pedido é só sequencial (1001, 1002, 1003...) e a
  // página nunca confere se o pedido pertence mesmo a quem está logado.
  function carregar() {
    const params = new URLSearchParams(window.location.search);
    const pedidoId = params.get('pedido');
    const alvo = document.getElementById('conteudo-pedidos');
    const sessao = getSessao();

    if (!sessao) {
      alvo.innerHTML = '<p>Você precisa <a href="login.html">entrar</a> para ver pedidos.</p>';
      return;
    }

    if (pedidoId) {
      const pedido = getPedidos().find(p => String(p.id) === String(pedidoId));
      if (!pedido) { alvo.innerHTML = '<p>Pedido não encontrado.</p>'; return; }

      const donoDiferente = pedido.usuarioId !== sessao.id;
      const dono = getAllUsers().find(u => u.id === pedido.usuarioId);

      alvo.innerHTML = `
        <a href="pedidos.html">&larr; Voltar para meus pedidos</a>
        <h1>Pedido nº ${pedido.id}</h1>
        ${donoDiferente ? `
          <div class="alert alert-warn">
            Este pedido pertence a <strong>${dono ? dono.nome : 'outro usuário'}</strong>,
            não a você — mas a página mostrou os dados assim mesmo porque só olhou o
            número do pedido na URL, sem checar o dono. FLAG{HISTORICO_PEDIDOS_EXPOSTO}
          </div>` : ''}
        <p><strong>Data:</strong> ${pedido.data}</p>
        <p><strong>Endereço de entrega:</strong> ${pedido.enderecoEntrega}</p>
        <ul>${pedido.itens.map(i => `<li>${i.qtd}x ${i.nome} — R$ ${(i.preco * i.qtd).toFixed(2)}</li>`).join('')}</ul>
        <p><strong>Total pago:</strong> R$ ${pedido.valorPago.toFixed(2)}</p>
      `;
      return;
    }

    const meusPedidos = getPedidos().filter(p => p.usuarioId === sessao.id);
    alvo.innerHTML = `
      <h1>Meus pedidos</h1>
      ${meusPedidos.length === 0 ? '<p>Você ainda não fez nenhum pedido. <a href="loja.html">Ir às compras</a></p>' : ''}
      <div class="grid">
        ${meusPedidos.map(p => `
          <article class="card">
            <h3>Pedido nº ${p.id}</h3>
            <p>${p.data}</p>
            <p>${p.itens.length} item(ns) — R$ ${p.valorPago.toFixed(2)}</p>
            <a class="btn btn-sm" href="pedidos.html?pedido=${p.id}">Ver detalhes</a>
          </article>
        `).join('')}
      </div>
    `;
  }
  document.addEventListener('DOMContentLoaded', carregar);
</script>
</body>
</html>
