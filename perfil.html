<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil — Três Porquinhos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="22" fill="#D98B8B"/><ellipse cx="32" cy="38" rx="10" ry="7" fill="#C97272"/><circle cx="27" cy="37" r="1.6" fill="#5C3A3A"/><circle cx="37" cy="37" r="1.6" fill="#5C3A3A"/></svg>
      <span>Três Porquinhos</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="loja.html">Loja</a>
      <a class="cart-link" href="carrinho.html">Carrinho <span id="cart-count" class="cart-count" style="display:none;">0</span></a>
      <span id="nav-user"></span>
      <a id="nav-pedidos-link" href="pedidos.html" style="display:none;">Meus pedidos</a>
      <a id="nav-admin-link" class="admin-link" href="admin.html" style="display:none;">Painel administrativo</a>
      <a id="nav-logout-link" href="#" onclick="logout();return false;">Sair</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="profile-card" id="perfil-conteudo">
      <!-- preenchido via JS -->
    </div>
  </div>
</section>

<footer>
  Fazenda Três Porquinhos — site criado para fins de estudo de segurança web.
</footer>

<script src="js/app.js"></script>
<script>
  // A página só lê o id que veio na URL e mostra o perfil correspondente.
  // TODO: validar se o usuário logado é o dono desse id antes de mostrar os dados.
  function carregarPerfil() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const alvo = document.getElementById('perfil-conteudo');

    if (!id) {
      alvo.innerHTML = '<p>Informe um perfil pela URL, por exemplo <code>perfil.html?id=2</code>.</p>';
      return;
    }

    const usuario = getAllUsers().find(u => String(u.id) === String(id));

    if (!usuario) {
      alvo.innerHTML = '<p>Perfil não encontrado.</p>';
      return;
    }

    alvo.innerHTML = `
      <h1>${usuario.nome}</h1>
      <p style="color:var(--ink-soft)">@${usuario.username}</p>
      <dl>
        <dt>E-mail</dt><dd>${usuario.email}</dd>
        <dt>Telefone</dt><dd>${usuario.telefone || '-'}</dd>
        <dt>Endereço</dt><dd>${usuario.endereco || '-'}</dd>
        <dt>Tipo de conta</dt><dd>${usuario.role}</dd>
      </dl>
      <div class="bio-box">${usuario.bio || ''}</div>
    `;
  }
  document.addEventListener('DOMContentLoaded', carregarPerfil);
</script>
</body>
</html>
