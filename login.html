<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Três Porquinhos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="22" fill="#D98B8B"/><ellipse cx="32" cy="38" rx="10" ry="7" fill="#C97272"/><circle cx="27" cy="37" r="1.6" fill="#5C3A3A"/><circle cx="37" cy="37" r="1.6" fill="#5C3A3A"/></svg>
      <span>Três Porquinhos</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="loja.html">Loja</a>
      <a href="cadastro.html">Criar conta</a>
    </nav>
  </div>
</header>

<section class="form-page">
  <div class="container">
    <div class="form-card">
      <h1>Entrar</h1>
      <div id="alerta"></div>
      <form onsubmit="return fazerLogin(event)">
        <div class="field">
          <label for="username">Usuário</label>
          <input id="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit">Entrar</button>
      </form>
      <p class="form-note">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </div>
</section>

<footer>
  Fazenda Três Porquinhos — site criado para fins de estudo de segurança web.
</footer>

<script src="js/app.js"></script>
<script>
  function fazerLogin(ev) {
    ev.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const usuario = login(username, password);
    const alerta = document.getElementById('alerta');

    if (usuario) {
      iniciarSessao(usuario);
      window.location.href = 'index.html';
    } else {
      alerta.innerHTML = '<div class="alert alert-error">Usuário ou senha inválidos.</div>';
    }
    return false;
  }
</script>
</body>
</html>
